services:
  documents-api:
    build:
      context: .
      dockerfile: Documents/Documents.Api/Dockerfile
    container_name: documents-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8008:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=MmcDocumentsDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      - RabbitMqSettings__Host=rabbitmq
      - RabbitMqSettings__Username=guest
      - RabbitMqSettings__Password=guest
      - MinioSettings__Endpoint=minio:9000
      - MinioSettings__AccessKey=${MINIO_ROOT_USER}
      - MinioSettings__SecretKey=${MINIO_ROOT_PASSWORD}
      - MinioSettings__Bucket=medical-center-documents
      - MinioSettings__UseSsl=false
      - GrpcClients__Appointments=http://appointments-api:8080
      - GrpcClients__Profiles=http://profiles-api:8080
      - GrpcClients__Offices=http://offices-api:8080
    networks:
      - medical-network

syntax = "proto3";

option csharp_namespace = "Appointments.Api.Protos";

package appointments;

service AppointmentsService {
    rpc GetAvailableSlots (GetAvailableSlotsRequest) returns (GetAvailableSlotsResponse);

    rpc CreateAppointment (CreateAppointmentRequest) returns (CreateAppointmentResponse);
    rpc CreateAppointmentByReceptionist (CreateAppointmentByReceptionistRequest) returns (CreateAppointmentResponse);
    rpc RescheduleAppointment (RescheduleAppointmentRequest) returns (RescheduleAppointmentResponse);
    rpc RescheduleMyAppointment (RescheduleAppointmentRequest) returns (RescheduleAppointmentResponse);
    rpc ApproveAppointment (ApproveAppointmentRequest) returns (ApproveAppointmentResponse);
    rpc CancelAppointment (CancelAppointmentRequest) returns (CancelAppointmentResponse);

    rpc GetAppointments (GetAppointmentsRequest) returns (AppointmentListResponse);
    rpc GetDoctorSchedule (GetDoctorScheduleRequest) returns (AppointmentListResponse);
    rpc GetMyAppointments (GetMyAppointmentsRequest) returns (AppointmentListResponse);
    rpc GetPatientAppointments (GetPatientAppointmentsRequest) returns (AppointmentListResponse);

    rpc CreateAppointmentResult (SaveAppointmentResultRequest) returns (CreateAppointmentResultResponse);
    rpc UpdateAppointmentResult (SaveAppointmentResultRequest) returns (UpdateAppointmentResultResponse);
    rpc GetAppointmentResult (GetAppointmentResultRequest) returns (AppointmentResultResponse);
}

message SaveAppointmentResultRequest {
    string appointment_id = 1;
    string complaints = 2;
    string conclusion = 3;
    string recommendations = 4;
    string diagnosis = 5;
}

message CreateAppointmentResultResponse {
    string result_id = 1;
}

message UpdateAppointmentResultResponse {
}

message GetAppointmentResultRequest {
    string appointment_id = 1;
}

message AppointmentResultResponse {
    string result_id = 1;
    string appointment_id = 2;
    string date = 3;
    string start_time = 4;
    string end_time = 5;
    string patient_id = 6;
    string patient_first_name = 7;
    string patient_last_name = 8;
    string patient_middle_name = 9;
    string patient_date_of_birth = 10;
    string doctor_id = 11;
    string doctor_first_name = 12;
    string doctor_last_name = 13;
    string doctor_middle_name = 14;
    string specialization_name = 15;
    string service_id = 16;
    string service_name = 17;
    string complaints = 18;
    string conclusion = 19;
    string recommendations = 20;
    string diagnosis = 21;
}

message GetAppointmentsRequest {
    string date = 1;
    string doctor_id = 2;
    string service_id = 3;
    string office_id = 4;
    string status = 5;
}

message GetDoctorScheduleRequest {
    string date = 1;
}

message GetMyAppointmentsRequest {
}

message GetPatientAppointmentsRequest {
    string patient_id = 1;
}

message AppointmentListItem {
    string appointment_id = 1;
    string date = 2;
    string start_time = 3;
    string end_time = 4;
    string doctor_id = 5;
    string doctor_first_name = 6;
    string doctor_last_name = 7;
    string doctor_middle_name = 8;
    string patient_id = 9;
    string patient_first_name = 10;
    string patient_last_name = 11;
    string patient_middle_name = 12;
    string patient_phone_number = 13;
    string service_id = 14;
    string service_name = 15;
    string status = 16;
}

message AppointmentListResponse {
    repeated AppointmentListItem appointments = 1;
}

message CreateAppointmentRequest {
    string service_id = 1;
    string doctor_id = 2;
    string office_id = 3;
    string date = 4;
    string start_time = 5;
}

message CreateAppointmentByReceptionistRequest {
    string patient_id = 1;
    string service_id = 2;
    string doctor_id = 3;
    string office_id = 4;
    string date = 5;
    string start_time = 6;
}

message CreateAppointmentResponse {
    string appointment_id = 1;
}

message RescheduleAppointmentRequest {
    string appointment_id = 1;
    string doctor_id = 2;
    string date = 3;
    string start_time = 4;
}

message RescheduleAppointmentResponse {
}

message ApproveAppointmentRequest {
    string appointment_id = 1;
}

message ApproveAppointmentResponse {
}

message CancelAppointmentRequest {
    string appointment_id = 1;
}

message CancelAppointmentResponse {
}

message GetAvailableSlotsRequest {
    string date = 1;
    string service_id = 2;
    string doctor_id = 3;
    string office_id = 4;
}

message AvailableSlot {
    string start_time = 1;
    repeated string doctor_ids = 2;
}

message GetAvailableSlotsResponse {
    repeated AvailableSlot slots = 1;
}
